<style>
  :root {
    --navy: #14437B;        /* crest blue */
    --navy-deep: #0D2F58;
    --navy-ink: #0A2240;
    --cream: #F3EFE9;       /* crest sail / lettering */
    --cream-2: #E8E2D8;
    --paper: #FBF9F6;
    --line: #DDD6CB;
    --muted: #5E6B7C;
    --ink: #142033;
    --gold: #C9A227;        /* small accent for #1 spots */
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font: 17px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  h1, h2, h3, .display { font-family: Oswald, "Arial Narrow", Impact, sans-serif; letter-spacing: .02em; }

  /* ---------- Header ---------- */
  header.club {
    background: var(--navy);
    color: var(--cream);
    padding: 14px 16px 16px;
    position: relative;
    overflow: hidden;
  }
  header.club::after { /* wave motif from the crest */
    content: "";
    position: absolute; inset: auto 0 0 0; height: 10px;
    background:
      radial-gradient(10px 6px at 10px 0, transparent 70%, var(--navy-deep) 72%) 0 0/20px 10px repeat-x;
    opacity: .9;
  }
  .brand { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; }
  .brand img {
    width: 64px; height: 64px; flex: none; border-radius: 50%;
    box-shadow: 0 0 0 3px var(--cream), 0 4px 14px rgba(0,0,0,.25);
    background: var(--cream);
  }
  .brand h1 { margin: 0; font-size: 30px; line-height: 1; font-weight: 700; text-transform: uppercase; }
  .brand p { margin: 4px 0 0; font-size: 13px; line-height: 1.3; opacity: .85; }

  /* ---------- Tabs ---------- */
  nav.tabs {
    position: sticky; top: 0; z-index: 10;
    background: var(--navy-deep);
    box-shadow: 0 2px 10px rgba(10,34,64,.25);
  }
  .tablist { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 760px; margin: 0 auto; }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--cream);
    font: 600 14px/1.15 Oswald, "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .02em;
    min-height: 56px; padding: 8px 4px; cursor: pointer; opacity: .72;
    border-bottom: 4px solid transparent;
    -webkit-tap-highlight-color: transparent;
  }
  .tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--cream); background: rgba(255,255,255,.07); }
  .tab:focus-visible { outline: 3px solid var(--cream); outline-offset: -3px; }

  /* ---------- Layout ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 8px; }
  section[role="tabpanel"] { display: none; }
  section[role="tabpanel"].active { display: block; animation: fade .2s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .card-head {
    background: var(--navy); color: var(--cream); padding: 10px 16px;
    font: 600 16px/1.2 Oswald, sans-serif; text-transform: uppercase; letter-spacing: .06em;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .card-head .count { font: 600 13px Inter, sans-serif; opacity: .8; letter-spacing: 0; text-transform: none; }
  .card-body { padding: 16px; }

  .empty { color: var(--muted); font-size: 16px; padding: 16px; text-align: center; }
  .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 2px; }

  /* ---------- Next match ---------- */
  .versus { text-align: center; padding: 22px 16px 18px; border-bottom: 1px dashed var(--line); }
  .ha-badge {
    display: inline-block; font: 700 13px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 999px; background: var(--navy); color: var(--cream);
  }
  .ha-badge.away { background: var(--cream-2); color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
  .vs-line { margin: 12px 0 0; font: 700 32px/1.05 Oswald, sans-serif; text-transform: uppercase; color: var(--navy-ink); word-wrap: break-word; }
  .vs-line small { display: block; font-size: 16px; color: var(--muted); font-weight: 500; letter-spacing: .15em; margin: 6px 0; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; }
  .fact { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .fact:nth-child(odd) { border-right: 1px solid var(--line); }
  .fact.wide { grid-column: 1 / -1; border-right: 0; }
  .fact .label { font: 600 12px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .fact .value { font: 600 22px/1.2 Oswald, sans-serif; color: var(--navy-ink); margin-top: 2px; }
  .fact .value.text { font: 600 18px/1.35 Inter, sans-serif; }
  .fact .sub { color: var(--muted); font-size: 16px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px; min-height: 50px; padding: 12px 18px; border-radius: 12px;
    background: var(--navy); color: var(--cream); text-decoration: none;
    font: 600 17px Inter, sans-serif;
  }
  .btn:active { transform: translateY(1px); background: var(--navy-deep); }
  .btn svg { width: 20px; height: 20px; }

  .squad { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .squad li {
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    font-size: 17px; font-weight: 500;
  }
  .squad li b { font-weight: 700; color: var(--navy-ink); }
  .squad li:nth-child(odd) { border-right: 1px solid var(--line); }
  @media (max-width: 340px) { .squad { grid-template-columns: 1fr; } .squad li { border-right: 0; } }

  /* ---------- Fixtures & results ---------- */
  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid; grid-template-columns: 78px 1fr auto; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .date { font: 600 14px/1.2 Inter, sans-serif; color: var(--muted); text-transform: uppercase; }
  .row .date b { display: block; font: 700 20px/1 Oswald, sans-serif; color: var(--navy-ink); }
  .row .opp { font-weight: 600; font-size: 17px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
  .row .opp .ha { display: block; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .score {
    font: 700 20px/1 Oswald, sans-serif; padding: 7px 10px; border-radius: 8px; min-width: 64px; text-align: center;
    background: var(--cream-2); color: var(--navy-ink);
  }
  .score.W { background: var(--navy); color: var(--cream); }
  .score.L { background: transparent; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); }
  .pill { font: 700 13px Inter, sans-serif; letter-spacing: .08em; padding: 6px 10px; border-radius: 999px; background: var(--navy); color: var(--cream); }
  .pill.A { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }

  /* ---------- League table ---------- */
  table.league { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 15px; }
  table.league th {
    font: 600 12px Inter, sans-serif; letter-spacing: .06em; color: var(--muted); text-transform: uppercase;
    padding: 10px 2px; border-bottom: 2px solid var(--navy); text-align: center;
  }
  table.league td { padding: 11px 2px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  table.league th.team, table.league td.team { text-align: left; padding-left: 6px; }
  table.league td.team { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  table.league col.pos { width: 34px; } table.league col.n { width: 25px; } table.league col.gd { width: 38px; } table.league col.pts { width: 36px; }
  table.league td.pts { font-weight: 700; }
  table.league tr.us td { background: var(--navy); color: var(--cream); font-weight: 700; border-bottom-color: var(--navy); }
  table.league tr.us td:first-child { box-shadow: inset 5px 0 0 var(--cream); }
  table.league sup { font-size: 11px; }
  .table-note { padding: 12px 16px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }
  .table-note b { color: var(--ink); }

  /* ---------- Stats ---------- */
  .select-wrap { position: relative; margin-bottom: 16px; }
  .select-wrap label { display: block; font: 600 13px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  select {
    width: 100%; appearance: none; -webkit-appearance: none;
    min-height: 54px; padding: 12px 48px 12px 16px; border-radius: 12px;
    border: 2px solid var(--navy); background: var(--paper); color: var(--navy-ink);
    font: 600 18px Inter, sans-serif;
  }
  .select-wrap::after {
    content: ""; position: absolute; right: 18px; bottom: 22px; width: 10px; height: 10px;
    border-right: 3px solid var(--navy); border-bottom: 3px solid var(--navy); transform: rotate(45deg);
    pointer-events: none;
  }
  .rank { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .rank:last-child { border-bottom: 0; }
  .rank .pos { font: 700 20px Oswald, sans-serif; color: var(--muted); text-align: center; }
  .rank .name { font-weight: 600; font-size: 17px; }
  .rank .bar { height: 6px; border-radius: 3px; background: var(--cream-2); margin-top: 6px; overflow: hidden; }
  .rank .bar i { display: block; height: 100%; background: var(--navy); border-radius: 3px; }
  .rank .val { font: 700 24px Oswald, sans-serif; color: var(--navy-ink); min-width: 36px; text-align: right; }
  .rank.top { background: linear-gradient(90deg, rgba(20,67,123,.08), transparent); }
  .rank.top .pos { color: var(--paper); background: var(--navy); border-radius: 50%; width: 36px; height: 36px; line-height: 36px; margin: 0 auto; font-size: 18px; }

  /* ---------- Lock screen ---------- */
  .lock { max-width: 420px; margin: 8px auto 24px; text-align: center; }
  .lock .card-body { padding: 24px 20px 22px; }
  .lock img { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 0 0 3px var(--navy); margin-bottom: 10px; }
  .lock h2 { margin: 0 0 4px; font-size: 26px; text-transform: uppercase; color: var(--navy-ink); }
  .lock p { margin: 0 0 18px; color: var(--muted); font-size: 16px; }
  .lock input[type=password] {
    width: 100%; min-height: 54px; padding: 12px 16px; border-radius: 12px;
    border: 2px solid var(--navy); background: #fff; color: var(--navy-ink);
    font: 600 20px Inter, sans-serif; letter-spacing: .15em; text-align: center; text-transform: uppercase;
  }
  .lock input:focus { outline: 3px solid rgba(20,67,123,.3); outline-offset: 2px; }
  .lock button.btn { width: 100%; border: 0; cursor: pointer; font-family: Inter, sans-serif; }
  .lock .remember { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: 15px; color: var(--muted); }
  .lock .remember input { width: 20px; height: 20px; accent-color: var(--navy); }
  .lock .err { color: #B3261E; font-weight: 600; font-size: 15px; min-height: 22px; margin-top: 10px; }
  .locked nav.tabs, .locked section[role="tabpanel"] { display: none !important; }
  body:not(.locked) .lock { display: none; }

  /* ---------- Footer ---------- */
  footer { background: var(--navy-ink); color: var(--cream); text-align: center; padding: 22px 16px 28px; margin-top: 10px; }
  footer .display { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; opacity: .75; }
  footer .who { font-weight: 600; font-size: 18px; margin: 6px 0 2px; }
  footer a { color: var(--cream); font-size: 16px; overflow-wrap: anywhere; }
  footer .small { font-size: 13px; opacity: .6; margin-top: 14px; }
</style>
</head>

/* ---------- helpers ---------- */
const CLUB = "Ludham";
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const surname = n => n.trim().split(/\s+/).slice(-1)[0];
const bySurname = (a, b) => surname(a).localeCompare(surname(b), "en-GB") || a.localeCompare(b, "en-GB");
const isHome = v => /^h/i.test(String(v || "").trim());
const isAway = v => /^a/i.test(String(v || "").trim());
const haWord = v => isHome(v) ? "Home" : isAway(v) ? "Away" : "";

function parseDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
  return isNaN(d) ? null : d;
}
const fmt = (s, opts) => { const d = parseDate(s); return d ? d.toLocaleDateString("en-GB", opts) : s; };
const longDate = s => fmt(s, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
function fmtTime(t) {
  if (!t) return "";
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t).trim());
  if (!m) return t;
  const h = +m[1], ap = h >= 12 ? "pm" : "am", h12 = ((h + 11) % 12) + 1;
  return m[2] === "00" ? `${h12}${ap}` : `${h12}:${m[2]}${ap}`;
}
/* Arrival defaults to 1 hour before kick-off unless an arrival time is given */
function arrivalTime(m) {
  if (m.arrival) return m.arrival;
  const k = /^(\d{1,2}):(\d{2})$/.exec(String(m.kickOff || "").trim());
  if (!k) return "";
  const mins = (+k[1] * 60 + +k[2] - 60 + 1440) % 1440;
  return String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0");
}
const empty = (title, msg) => `<div class="empty"><strong>${esc(title)}</strong>${esc(msg)}</div>`;
const card = (title, body, extra = "") => `<div class="card"><div class="card-head"><span>${title}</span>${extra}</div>${body}</div>`;

/* ---------- 1. Next match ---------- */
function renderNext() {
  const m = DATA.nextMatch || {};
  const has = Object.values(m).some(v => String(v || "").trim());
  let html;

  if (!has) {
    html = card("Next match", empty("Next match to be confirmed", "Details will appear here once they're announced."));
  } else {
    const ha = haWord(m.homeAway);
    const badge = ha ? `<span class="ha-badge ${ha === "Away" ? "away" : ""}">${ha}</span>` : "";
    const opp = esc(m.opponent || "Opponent TBC");
    const vs = isAway(m.homeAway)
      ? `${opp}<small>v</small>${CLUB}`
      : `${CLUB}<small>v</small>${opp}`;
    const tbc = v => v ? v : `<span class="sub">TBC</span>`;
    const place = [m.ground, m.address, m.postcode].filter(Boolean);
    const mapsQ = encodeURIComponent([m.ground, m.address, m.postcode].filter(Boolean).join(", "));
    const maps = place.length
      ? `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}" target="_blank" rel="noopener">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
           Open in Maps</a>`
      : "";

    html = card("Next match", `
      <div class="versus">${badge}<div class="vs-line">${vs}</div></div>
      <div class="facts">
        <div class="fact wide"><div class="label">Date</div><div class="value">${tbc(esc(longDate(m.date)))}</div></div>
        <div class="fact"><div class="label">Kick-off</div><div class="value">${tbc(esc(fmtTime(m.kickOff)))}</div></div>
        <div class="fact"><div class="label">Arrive by</div><div class="value">${tbc(esc(fmtTime(arrivalTime(m))))}</div></div>
        <div class="fact wide"><div class="label">Location</div>
          <div class="value text">${m.ground ? esc(m.ground) : `<span class="sub">Ground TBC</span>`}</div>
          ${m.address || m.postcode ? `<div class="sub">${esc([m.address, m.postcode].filter(Boolean).join(", "))}</div>` : ""}
          ${maps}
        </div>
      </div>`);
  }

  const squad = [...(DATA.squad || [])].filter(Boolean).sort(bySurname);
  const squadHtml = squad.length
    ? `<ul class="squad">${squad.map(n => {
        const parts = n.trim().split(/\s+/), last = parts.pop();
        return `<li>${esc(parts.join(" "))} <b>${esc(last)}</b></li>`;
      }).join("")}</ul>`
    : empty("Squad not announced yet", "Keep an eye on the WhatsApp group.");
  html += card("The squad", squadHtml, squad.length ? `<span class="count">${squad.length} players</span>` : "");

  $("#next").innerHTML = html;
}

/* ---------- 2. Fixtures & results ---------- */
function matchRow(f, showScore) {
  const d = parseDate(f.date);
  const date = d
    ? `<div class="date">${d.toLocaleDateString("en-GB", { weekday: "short" })}<b>${d.getDate()} ${d.toLocaleDateString("en-GB", { month: "short" })}</b></div>`
    : `<div class="date"><b>${esc(f.date || "TBC")}</b></div>`;
  const ha = haWord(f.homeAway);
  let right;
  if (showScore) {
    const s = /^\s*(\d+)\s*[-–]\s*(\d+)\s*$/.exec(f.score || "");
    const res = s ? (+s[1] > +s[2] ? "W" : +s[1] < +s[2] ? "L" : "D") : "";
    right = `<span class="score ${res}">${esc(s ? `${s[1]}–${s[2]}` : (f.score || "–"))}</span>`;
  } else {
    right = "";
  }
  return `<li class="row">${date}<div class="opp">${esc(f.opponent || "TBC")}${ha ? `<span class="ha">${ha}</span>` : ""}</div>${right}</li>`;
}
function renderFixtures() {
  const up = [...(DATA.fixtures || [])].sort((a, b) => (parseDate(a.date) || 0) - (parseDate(b.date) || 0));
  const res = [...(DATA.results || [])].sort((a, b) => (parseDate(b.date) || 0) - (parseDate(a.date) || 0));
  $("#fixtures").innerHTML =
    card("Upcoming fixtures", up.length ? `<ul class="rows">${up.map(f => matchRow(f, false)).join("")}</ul>`
      : empty("No fixtures listed yet", "Upcoming games will show here.")) +
    card("Previous results", res.length ? `<ul class="rows">${res.map(f => matchRow(f, true)).join("")}</ul>`
      : empty("No results listed yet", "Scores will show here after each game."));
}

/* ---------- 3. League table ---------- */
function renderTable() {
  const t = DATA.leagueTable || {}, rows = t.rows || [];
  const sign = n => (n > 0 ? "+" : "") + n;
  const anyNote = rows.some(r => r[8]);
  const body = rows.length ? `
    <table class="league">
      <colgroup><col class="pos"><col><col class="n"><col class="n"><col class="n"><col class="n"><col class="gd"><col class="pts"></colgroup>
      <thead><tr><th>Pos</th><th class="team">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr class="${String(r[1]).toLowerCase().startsWith(CLUB.toLowerCase()) ? "us" : ""}">
          <td>${esc(r[0])}</td><td class="team">${esc(r[1])}</td>
          <td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td>
          <td>${esc(sign(r[6]))}</td><td class="pts">${esc(r[7])}${r[8] ? `<sup>${esc(r[8])}</sup>` : ""}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <div class="table-note">
      As of <b>${t.asOf ? esc(longDate(t.asOf)) : "date to be confirmed"}</b>${anyNote ? " · <sup>*</sup> points adjusted" : ""}<br>
      <a href="https://fulltime.thefa.com/index.html?league=7079615" target="_blank" rel="noopener" style="color:var(--navy)">Full table on FA Full-Time</a>
    </div>`
    : empty("Table not available yet", "Check back soon.");
  $("#table").innerHTML = card("NEN League · Division One", body);
}

/* ---------- 4. Player stats ---------- */
const STATS = {
  goals:       { label: "Top goal scorers", unit: "goals" },
  assists:     { label: "Top assists",      unit: "assists" },
  appearances: { label: "Appearances",      unit: "apps" }
};
function renderStatsShell() {
  $("#stats").innerHTML = `
    <div class="select-wrap">
      <label for="statPick">Show</label>
      <select id="statPick">${Object.entries(STATS).map(([k, s]) => `<option value="${k}">${s.label}</option>`).join("")}</select>
    </div>
    <div id="statList"></div>`;
  $("#statPick").addEventListener("change", e => renderStatList(e.target.value));
  renderStatList("goals");
}
function renderStatList(key) {
  const s = STATS[key];
  const list = Object.entries(DATA[key] || {})
    .map(([name, v]) => [name, Number(v) || 0])
    .filter(([, v]) => v >= 1)
    .sort((a, b) => b[1] - a[1] || bySurname(a[0], b[0]));
  const max = list.length ? list[0][1] : 1;
  let lastVal = null, lastRank = 0;
  const rows = list.map(([name, v], i) => {
    const rank = v === lastVal ? lastRank : i + 1; lastVal = v; lastRank = rank;
    return `<div class="rank ${rank === 1 ? "top" : ""}">
      <div class="pos">${rank}</div>
      <div><div class="name">${esc(name)}</div><div class="bar"><i style="width:${(v / max) * 100}%"></i></div></div>
      <div class="val">${v}</div></div>`;
  }).join("");
  $("#statList").innerHTML = card(esc(s.label), list.length ? rows : empty("Nothing to show yet", "Stats will appear once the season gets going."),
    `<span class="count">2026/27 · ${s.unit}</span>`);
}

/* ---------- tabs ---------- */
const TABS = ["next", "fixtures", "table", "stats"];
function show(id, push) {
  if (!TABS.includes(id)) id = "next";
  document.querySelectorAll(".tab").forEach(b => {
    const on = b.dataset.tab === id;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll("[role=tabpanel]").forEach(p => p.classList.toggle("active", p.id === id));
  if (push) history.replaceState(null, "", "#" + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => show(b.dataset.tab, true)));
$(".tablist").addEventListener("keydown", e => {
  const i = TABS.indexOf(document.activeElement.dataset.tab);
  if (i < 0 || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const n = TABS[(i + (e.key === "ArrowRight" ? 1 : 3)) % 4];
  show(n, true); $(`[data-tab="${n}"]`).focus();
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

/* ---------- password lock ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptData(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw.trim().toUpperCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(LOCKED.salt), iterations: LOCKED.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCKED.iv) }, key, b64(LOCKED.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function startSite() {
  document.body.classList.remove("locked");
  renderNext(); renderFixtures(); renderTable(); renderStatsShell();
  show(location.hash.slice(1));
}
const PW_KEY = "ludhamfc-pw";
async function tryUnlock(pw, remember) {
  try { DATA = await decryptData(pw); } catch (e) { return false; }
  try { remember ? localStorage.setItem(PW_KEY, pw) : localStorage.removeItem(PW_KEY); } catch (e) {}
  startSite();
  return true;
}
$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#unlockBtn"); btn.disabled = true; btn.textContent = "Checking…"; $("#pwErr").textContent = "";
  const ok = await tryUnlock($("#pw").value, $("#remember").checked);
  if (!ok) { $("#pwErr").textContent = "That password isn't right. Try again."; $("#pw").select(); }
  btn.disabled = false; btn.textContent = "Unlock";
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(PW_KEY); } catch (e) {}
  if (!(saved && await tryUnlock(saved, true))) {
    try { localStorage.removeItem(PW_KEY); } catch (e) {}
    $("#pw").focus({ preventScroll: true });
  }
})();

<style>
  :root {
    --paper: #F3EFE9;
    --paper-2: #EAE4DA;
    --ink: #0A2240;
    --navy: #14437B;
    --muted: #4F5B6E;
    --rule: #C9C1B4;
    --nav-h: 66px;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
    padding-bottom: calc(var(--nav-h) + var(--safe));
  }
  body.locked { padding-bottom: 0; }
  .display { font-family: Anton, Impact, "Arial Narrow", sans-serif; font-weight: 400; letter-spacing: .01em; }
  .serif { font-family: "Source Serif 4", Georgia, serif; font-style: italic; }
  .caps { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }
  a { color: var(--navy); }

  /* ---------- Masthead ---------- */
  .masthead { padding-top: 18px; }
  .mast-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .mast-row img { width: 48px; height: 48px; border-radius: 50%; flex: none; }
  .mast-row h1 { margin: 0; font-size: 28px; line-height: 1; letter-spacing: .14em; }
  .double-rule { margin-top: 12px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); height: 4px; }
  .mast-meta { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--ink); }
  .mast-meta span { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }

  /* ---------- Panels ---------- */
  main { padding-top: 6px; }
  section[role="tabpanel"] { display: none; }
  section[role="tabpanel"].active { display: block; }
  .panel-title { margin: 22px 0 0; font-size: 46px; line-height: 1; text-transform: uppercase; }
  .panel-sub { margin: 4px 0 0; font-size: 16px; color: var(--muted); }
  .section-head { display: flex; align-items: center; gap: 10px; margin: 28px 0 4px; }
  .section-head h3 { margin: 0; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; }
  .section-head::after { content: ""; flex: 1; border-top: 1px solid var(--ink); }
  .empty { margin: 8px 0 0; font-size: 17px; color: var(--muted); }

  /* Next match */
  .fixture { position: relative; padding-top: 22px; }
  .fixture .date { font-size: 19px; color: var(--navy); }
  .team { display: block; margin: 0; font-size: clamp(44px, 14vw, 66px); line-height: .98; text-transform: uppercase; overflow-wrap: break-word; }
  .team.first { padding-right: 84px; margin-top: 6px; }
  .team.us { color: var(--navy); }
  .versus { display: block; font-size: 22px; margin: 4px 0; }
  .stamp {
    position: absolute; top: 18px; right: 0; width: 78px; height: 78px; border-radius: 50%;
    border: 2.5px solid var(--navy); color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; letter-spacing: .1em; transform: rotate(12deg);
  }
  .stamp::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1px solid var(--navy); }
  .countdown { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); align-items: center; margin-top: 22px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .countdown .lbl { padding: 10px 12px 10px 0; font-size: 11px; line-height: 1.3; }
  .countdown .u { padding: 8px 0 6px; text-align: center; border-left: 1px solid var(--rule); }
  .countdown .u b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
  .countdown .u span { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
  .live { display: flex; align-items: center; gap: 10px; margin-top: 22px; padding: 12px 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); font-size: 24px; }
  .live i { width: 12px; height: 12px; border-radius: 50%; background: #2E9E5B; animation: pulse 1.4s ease-out infinite; }

  .facts { margin-top: 18px; border-top: 2px solid var(--ink); }
  .facts .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--ink); }
  .fact { padding: 12px 0; }
  .facts .pair .fact + .fact { border-left: 1px solid var(--ink); padding-left: 16px; }
  .fact .big { font-family: Anton, Impact, sans-serif; font-size: 36px; line-height: 1.1; }
  .fact .tbc { font-family: "Source Serif 4", Georgia, serif; font-style: italic; font-size: 22px; color: var(--muted); }
  .venue { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--ink); }
  .venue .name { font-size: 18px; font-weight: 600; line-height: 1.3; margin-top: 2px; }
  .venue .addr { font-size: 15px; color: var(--muted); }
  .btn {
    flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px;
    background: var(--ink); color: var(--paper); text-decoration: none; border: 0;
    font-family: Anton, Impact, sans-serif; font-size: 16px; letter-spacing: .1em; cursor: pointer;
    transition: transform .12s, background-color .2s;
  }
  .btn:active { transform: scale(.97); background: var(--navy); }
  .btn svg { width: 18px; height: 18px; }
  .venue .btn { margin-bottom: 12px; }

  .squad { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }
  .squad li { padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 17px; }
  .squad li b { font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  @media (max-width: 340px) { .squad { grid-template-columns: 1fr; } }

  .ft { position: relative; padding-top: 22px; }
  .big-stamp {
    position: absolute; left: 50%; top: 46%; z-index: 3; pointer-events: none; opacity: 0;
    padding: 6px 22px 2px; border: 6px solid currentColor; color: var(--navy);
    font-family: Anton, Impact, sans-serif; font-size: 92px; line-height: 1; letter-spacing: .08em;
    transform: translate(-50%, -50%) rotate(-12deg); background: rgba(243,239,233,.55); mix-blend-mode: multiply;
  }
  .big-stamp::after { content: ""; position: absolute; inset: 5px; border: 2px solid currentColor; }

  @keyframes big-stamp {

    26%  { transform: translate(-50%, -50%) rotate(-12deg) scale(1); }

  .ft-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 17px; font-weight: 600; }

  .preview { margin: 10px 0 0; font-family: "Source Serif 4", Georgia, serif; font-size: 18px; line-height: 1.55; }

  /* Fixtures & results */

  .rank { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }

  /* Footer */
  footer { margin-top: 36px; padding: 16px 0 24px; border-top: 3px double var(--ink); text-align: center; }

  @media (max-width: 340px) { .staff { grid-template-columns: 1fr; gap: 12px; } .staff > div + div { border-left: 0; } }

  /* Result rows are links to the match page */
  a.fx-row { grid-template-columns: 58px minmax(0, 1fr) auto 14px; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a.fx-row:active { background: var(--paper-2); }
  a.fx-row .chev { width: 14px; height: 14px; color: var(--muted); }
  .fx li { list-style: none; }

  /* Match page */
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 10px; color: var(--ink); text-decoration: none; }
  .back svg { width: 16px; height: 16px; }

  .sl .gl { font-family: Anton, Impact, sans-serif; font-size: 56px; line-height: .9; font-variant-numeric: tabular-nums; }
  .sl.us .nm, .sl.us .gl { color: var(--navy); }

  .ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 17px; font-weight: 600; }
  .ev .n { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; }

  .award.star { background: var(--ink); color: var(--paper); }

  /* Fines */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
  .tile { padding: 12px 10px 10px; border: 2px solid var(--ink); text-align: center; }

  .tile.dark .caps { color: #C9D4E6; }

  .fine-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 17px; }

  .paid.no { background: var(--ink); color: var(--paper); }

  /* Manager */
  .pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .pick { min-height: 48px; padding: 8px 10px; border: 2px solid var(--ink); background: transparent; color: var(--ink); text-align: left; font: 500 15px/1.2 Inter, sans-serif; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s, color .15s; }
  .pick b { font-weight: 700; text-transform: uppercase; }
  .pick.on { background: var(--ink); color: var(--paper); }
  .pick-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .roles select { font-size: 18px; min-height: 48px; padding: 8px 36px 8px 10px; }
  .roles .select-wrap::after { top: 16px; right: 14px; }
  .msg { margin-top: 14px; }
  .msg textarea { width: 100%; min-height: 150px; padding: 12px; border: 2px solid var(--ink); border-radius: 0; background: #FFFDF9; color: var(--ink); font: 16px/1.45 Inter, sans-serif; resize: vertical; }
  .msg .btn { width: 100%; justify-content: center; margin-top: 8px; }
  .msg .btn.done { background: var(--navy); }
  .linkbtn { appearance: none; border: 0; background: none; padding: 8px 0; color: var(--navy); font: 600 15px Inter, sans-serif; text-decoration: underline; cursor: pointer; }
  footer .linkbtn { margin-top: 14px; font-size: 14px; color: var(--muted); }

  /* Bottom nav */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--ink); padding-bottom: var(--safe);
    box-shadow: 0 -4px 18px rgba(10,34,64,.18);
  }
  .tablist { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; height: var(--nav-h); }
  .tab {
    appearance: none; border: 0; background: transparent; color: #A9B6CB; cursor: pointer;
    font-family: Anton, Impact, sans-serif; font-size: 15px; letter-spacing: .1em; line-height: 1.1; padding: 0 2px;
    -webkit-tap-highlight-color: transparent; transition: color .25s;
  }
  .tab[aria-selected="true"] { color: var(--paper); }
  .tablist.many .tab { font-size: 13px; letter-spacing: .05em; }
  .tab:focus-visible { outline: 3px solid var(--paper); outline-offset: -4px; }
  .tab-ink { position: absolute; left: 0; bottom: 12px; width: 25%; z-index: 0; display: flex; justify-content: center; pointer-events: none; transition: transform .45s cubic-bezier(.3,1.25,.5,1); }
  .tab-ink::before { content: ""; width: 26px; height: 3px; background: var(--paper); }

  /* Lock screen */
  .lock { padding: 28px 0 10px; text-align: center; }

  .lock input[type=password] {
    width: 100%; min-height: 56px; padding: 12px 16px; border: 2px solid var(--ink); border-radius: 0;

  }

  .lock .btn { width: 100%; justify-content: center; margin-top: 12px; min-height: 54px; font-size: 18px; }
  .remember { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; font-size: 15px; color: var(--muted); }
  .remember input { width: 20px; height: 20px; accent-color: var(--ink); }
  .err { min-height: 24px; margin-top: 10px; color: #A3261C; font-weight: 600; font-size: 15px; }
  .sr { position: absolute; left: -9999px; }
  .locked nav.tabs, .locked section[role="tabpanel"], .locked footer { display: none !important; }
  body:not(.locked) .lock { display: none; }

  /* ---------- Animation ---------- */
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3px) rotate(4deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { from { clip-path: inset(0 0 100% 0); transform: translateY(24px); } to { clip-path: inset(0 0 -10% 0); transform: none; } }
  @keyframes rule-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes stamp { 0% { opacity: 0; transform: rotate(-8deg) scale(1.9); } 60% { opacity: 1; transform: rotate(14deg) scale(.94); } 100% { transform: rotate(12deg) scale(1); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
  @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,158,91,.6); } 100% { box-shadow: 0 0 0 12px rgba(46,158,91,0); } }

  .mast-row img { animation: bob 4.5s ease-in-out infinite; }
  .mast-row h1 { animation: rise .6s cubic-bezier(.2,.8,.2,1) both .05s; }
  .double-rule { transform-origin: center; animation: rule-draw .7s cubic-bezier(.2,.8,.2,1) both .15s; }
  .mast-meta { animation: rise .5s ease-out both .35s; }
  .lock { animation: rise .55s cubic-bezier(.2,.8,.2,1) both .3s; }
  .lock.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
  .lock.leaving { transition: opacity .3s, transform .3s; opacity: 0; transform: translateY(-10px); animation: none; }

  .play .panel-title, .play .team { animation: reveal .65s cubic-bezier(.2,.8,.2,1) both; }
  .play .team.second { animation-delay: .22s; }
  .play .versus, .play .fixture .date, .play .panel-sub { animation: rise .5s ease-out both .12s; }
  .play .stamp { animation: stamp .55s cubic-bezier(.2,.9,.3,1.2) both .45s; }
  .play .countdown .u { animation: pop .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--n) * 80ms + .5s); }
  .play .stagger { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms + 180ms); }
  .play .section-head::after { transform-origin: left; animation: rule-draw .6s cubic-bezier(.2,.8,.2,1) both .3s; }
  .play .score b { animation: pop .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms + 320ms); }
  .play .lt-row.us::before { animation: wipe .7s cubic-bezier(.6,0,.2,1) both .45s; }
  .play .match-head .stamp { animation: stamp .55s cubic-bezier(.2,.9,.3,1.2) both .45s; }
  .play .sl .gl { animation: pop .5s cubic-bezier(.2,.8,.2,1) both .35s; }
  .play .sl + .sl .gl { animation-delay: .5s; }
  .play .rank .bar i { animation: grow .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms + 260ms); }

  /* ---------- Loading screen ---------- */
  .loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); transition: background-color .5s ease .15s; }
  .loader .ring { position: relative; width: 170px; height: 170px; }
  .loader svg { position: absolute; inset: 0; transform: rotate(-90deg); transition: opacity .3s; }
  .loader circle { fill: none; stroke-width: 6; }
  .loader .track { stroke: #E2DBCF; }
  .loader .prog { stroke: var(--navy); stroke-linecap: round; }
  .loader .crest { position: absolute; left: 22px; top: 22px; width: 126px; height: 126px; border-radius: 50%; will-change: transform; }
  .loader .crest.pop { animation: crest-pop .35s cubic-bezier(.2,.8,.2,1); }
  .loader .k { margin-top: 22px; transition: opacity .25s; }
  .loader .pct { font-family: Anton, Impact, sans-serif; font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; transition: opacity .25s; }
  .loader.flying { background-color: rgba(243,239,233,0); pointer-events: none; }
  .loader.flying svg, .loader.flying .k, .loader.flying .pct { opacity: 0; }
  @keyframes crest-pop { 50% { transform: scale(1.08); } }
  body.loading .mast-row img { opacity: 0; animation: none; }
  body.loading .mast-row h1, body.loading .double-rule, body.loading .mast-meta, body.loading .lock { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

let DATA = null;

/* ---------- helpers ---------- */
const CLUB = "Ludham";
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cleanName = n => String(n).replace(/\s*\([^)]*\)\s*/g, " ").trim();
const surname = n => cleanName(n).split(/\s+/).slice(-1)[0];
function nameHtml(n) {
  const tags = [...String(n).matchAll(/\(([^)]*)\)/g)].map(m => m[1]);
  const p = cleanName(n).split(/\s+/), last = p.pop();
  return `${esc(p.join(" "))} <b>${esc(last)}</b>${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}`;
}
const bySurname = (a, b) => surname(a).localeCompare(surname(b), "en-GB") || a.localeCompare(b, "en-GB");
const isHome = v => /^h/i.test(String(v || "").trim());
const isAway = v => /^a/i.test(String(v || "").trim());
const haWord = v => isHome(v) ? "Home" : isAway(v) ? "Away" : "";
function parseDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
  return isNaN(d) ? null : d;
}
const fmt = (s, opts) => { const d = parseDate(s); return d ? d.toLocaleDateString("en-GB", opts) : s; };
const longDate = s => fmt(s, { weekday: "long", day: "numeric", month: "long" });
function fmtTime(t) {
  if (!t) return "";
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t).trim());
  if (!m) return t;
  const h = +m[1], ap = h >= 12 ? "pm" : "am", h12 = ((h + 11) % 12) + 1;
  return `${h12}.${m[2]}${ap}`;
}
/* Arrival defaults to 1 hour before kick-off unless an arrival time is given */
function arrivalTime(m) {
  if (m.arrival) return m.arrival;
  const k = /^(\d{1,2}):(\d{2})$/.exec(String(m.kickOff || "").trim());
  if (!k) return "";
  const mins = (+k[1] * 60 + +k[2] - 60 + 1440) % 1440;
  return String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0");
}
const sectionHead = t => `<div class="section-head"><h3 class="display">${t}</h3></div>`;
const emptyLine = t => `<p class="empty serif">${esc(t)}</p>`;

/* Last result stays on the Match tab until the Tuesday after the game (at most 3 days) */
function recentResult() {
  const last = [...(DATA.results || [])].sort((a, b) => (parseDate(b.date) || 0) - (parseDate(a.date) || 0))[0];
  const d = last && parseDate(last.date);
  if (!d) return null;
  const now = new Date();
  const toTue = (2 - d.getDay() + 7) % 7 || 7;
  const until = new Date(d); until.setDate(d.getDate() + Math.min(toTue, 3));
  return now >= d && now < until ? last : null;
}
function fullTimeBlock() {
  const f = recentResult(); if (!f) return "";
  const s = /^\s*(\d+)\s*[-–]\s*(\d+)\s*$/.exec(f.score || ""); if (!s) return "";
  const us = +s[1], them = +s[2], r = us > them ? "Won" : us < them ? "Lost" : "Drew";
  const rep = f.report || {};
  const line = (name, g, mine) => `<div class="sl ${mine ? "us" : ""}"><span class="nm">${esc(name)}</span><span class="gl">${g}</span></div>`;
  const rows = isAway(f.homeAway) ? line(f.opponent, them, false) + line(CLUB, us, true) : line(CLUB, us, true) + line(f.opponent, them, false);
  const bits = [
    rep.motm ? `<div class="ft-row"><span class="caps">Man of the Match</span><span>${esc(cleanName(rep.motm))}</span></div>` : "",
    rep.supporters ? `<div class="ft-row"><span class="caps">Supporters' Player</span><span>${esc(cleanName(rep.supporters))}</span></div>` : ""].join("");
  return `
    <div class="ft">
      <div class="big-stamp ${r}" aria-hidden="true">${r === "Drew" ? "DRAW" : r.toUpperCase()}</div>
      <div class="match-head">
        <div class="date serif">Full time · ${esc(fmt(f.date, { weekday: "long", day: "numeric", month: "long" }))}</div>
        <div class="stamp display" aria-label="${r}">${r.toUpperCase()}</div>
        <div class="scoreline">${rows}</div>
      </div>
      ${bits}
      <a class="btn ft-btn" href="#match-${esc(f.date)}">MATCH REPORT
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>`;
}

/* League positions for the next match (shown to supporters instead of arrival time) */
const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
function tablePos(name) {
  const words = s => String(s).toLowerCase().replace(/\(.*?\)|f\.c\.|\bfc\b|[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  const w = words(name); if (!w.length) return null;
  const hits = ((DATA.leagueTable || {}).rows || []).filter(r => {
    const t = words(r[1]);
    return t[0] === w[0] && t.includes("reserves") === w.includes("reserves") && t.includes("u23") === w.includes("u23");
  });
  return hits.length === 1 ? hits[0][0] : null;
}
function positionsFact(m) {
  const us = tablePos(CLUB), them = m.opponent ? tablePos(m.opponent) : null;
  if (!us || !them) return `<div class="fact"><div class="caps">Ludham</div><div class="big">${us ? ordinal(us) : "–"}</div></div>`;
  const away = isAway(m.homeAway);
  return `<div class="fact"><div class="caps">League positions</div><div class="big" style="font-size:30px;white-space:nowrap">${away ? ordinal(them) + " v " + ordinal(us) : ordinal(us) + " v " + ordinal(them)}</div></div>`;
}

/* ---------- 1. Next match ---------- */
function renderNext() {
  const m = DATA.nextMatch || {};
  const has = Object.values(m).some(v => String(v || "").trim());
  let html = "";
  if (!has) {
    html = `<h2 class="panel-title display">Next match</h2><p class="panel-sub serif">To be confirmed — details will appear here once announced.</p>`;
  } else {
    const ha = haWord(m.homeAway);
    const opp = esc(m.opponent || "Opponent TBC");
    const away = isAway(m.homeAway);
    const first = away ? opp : CLUB, second = away ? CLUB : opp;
    const val = (v, big = true) => v ? `<div class="${big ? "big" : "name"}">${esc(v)}</div>` : `<div class="tbc">TBC</div>`;
    const place = [m.ground, m.address, m.postcode].filter(Boolean);
    const maps = place.length
      ? `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.join(", "))}" target="_blank" rel="noopener">MAPS
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>` : "";
    html = `
      <div class="fixture">
        <div class="date serif">${m.date ? esc(longDate(m.date)) : "Date to be confirmed"}</div>
        <h2 style="margin:0">
          <span class="team first display ${away ? "" : "us"}">${first}</span>
          <span class="versus serif">versus</span>
          <span class="team second display ${away ? "us" : ""}">${second}</span>
        </h2>
        ${ha ? `<div class="stamp display" aria-label="${ha} game">${ha.toUpperCase()}</div>` : ""}
      </div>
      <div id="countdown"></div>
      <div class="facts">
        <div class="pair">
          <div class="fact"><div class="caps">Kick-off</div>${val(fmtTime(m.kickOff))}</div>
          ${DATA.role === "supporters" ? positionsFact(m) : `<div class="fact"><div class="caps">Arrive by</div>${val(fmtTime(arrivalTime(m)))}</div>`}
        </div>
        <div class="venue">
          <div class="fact"><div class="caps">Venue</div>${val(m.ground, false)}
            ${m.address || m.postcode ? `<div class="addr">${esc([m.address, m.postcode].filter(Boolean).join(", "))}</div>` : ""}</div>
          ${maps}
        </div>
      </div>`;
  }
  if (DATA.role === "supporters" && m.preview) {
    html += sectionHead("Match preview") + String(m.preview).split(/\n\s*\n/).map((para, i) => `<p class="preview${i ? "" : " first"}">${esc(para)}</p>`).join("");
  }
  const squad = [...(DATA.squad || [])].filter(Boolean).sort(bySurname);
  html += sectionHead(`The squad${squad.length ? ` · ${squad.length}` : ""}`) + (squad.length
    ? `<ul class="squad">${squad.map(n => `<li>${nameHtml(n)}</li>`).join("")}</ul>`
    : emptyLine("To be announced on the WhatsApp group."));
  const ft = fullTimeBlock();
  if (ft) html = ft + `<div class="next-after">${sectionHead("Next match")}${html}</div>`;
  $("#next").innerHTML = html;
  tickCountdown();
}

/* Countdown to kick-off */
let cdTimer = null;
function kickOffDate() {
  const m = DATA.nextMatch || {}, d = parseDate(m.date);
  const k = /^(\d{1,2}):(\d{2})$/.exec(String(m.kickOff || "").trim());
  if (!d || !k) return null;
  d.setHours(+k[1], +k[2], 0, 0);
  return d;
}
function tickCountdown() {
  clearTimeout(cdTimer);
  const el = $("#countdown"); if (!el) return;
  const ko = kickOffDate(); if (!ko) { el.innerHTML = ""; return; }
  const ms = ko - Date.now();
  if (ms <= 0) {
    el.innerHTML = ms > -2 * 3600e3 ? `<div class="live display"><i></i>GAME ON NOW</div>` : "";
    el.dataset.shape = "";
  } else {
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
          mi = Math.floor(s % 3600 / 60), sec = s % 60;
    const units = d ? [[d, "Days"], [h, "Hrs"], [mi, "Mins"]] : [[h, "Hrs"], [mi, "Mins"], [sec, "Secs"]];
    const shape = units.map(u => u[1]).join();
    if (el.dataset.shape === shape) {
      el.querySelectorAll(".u b").forEach((b, i) => b.textContent = String(units[i][0]).padStart(2, "0"));
    } else {
      el.innerHTML = `<div class="countdown"><div class="lbl caps">Kick-off<br>in</div>${units.map(([v, l], n) =>
        `<div class="u" style="--n:${n}"><b>${String(v).padStart(2, "0")}</b><span>${l.toUpperCase()}</span></div>`).join("")}</div>`;
      el.dataset.shape = shape;
    }
  }
  cdTimer = setTimeout(tickCountdown, 1000);
}

/* ---------- animation ---------- */
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STAGGER = ".fact, .squad li, .fx-row, .lt-row:not(.head), .rank, .ev, .award, .tile, .fine-row";
function countUp(root) {
  if (calm) return;
  root.querySelectorAll("[data-v]").forEach((el, i) => {
    const end = +el.dataset.v, start = performance.now() + i * 60 + 260, dur = 800;
    el.textContent = "0";
    const step = now => {
      const p = Math.min(1, Math.max(0, (now - start) / dur));
      el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function play(panel) {
  panel.classList.remove("play");
  panel.querySelectorAll(STAGGER).forEach((el, i) => { el.classList.add("stagger"); el.style.setProperty("--i", Math.min(i, 16)); });
  void panel.offsetWidth;
  panel.classList.add("play");
  countUp(panel);
}

  list.querySelectorAll(".tab").forEach(b => b.remove());
  list.style.gridTemplateColumns = `repeat(${TABS.length}, 1fr)`;
  list.classList.toggle("many", TABS.length > 4);
  $(".tab-ink").style.width = `${100 / TABS.length}%`;
  TABS.forEach(id => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.id = "tab-" + id; b.setAttribute("aria-controls", id); b.dataset.tab = id; b.textContent = TAB_LABELS[id];
    b.addEventListener("click", () => show(id, true));
    list.appendChild(b);
  });
}
function show(id, push) {
  let panel = id, tab = id;
  const m = /^match-(\d{4}-\d{2}-\d{2})$/.exec(id || "");
  if (m && renderMatch(m[1])) { panel = "match"; tab = "fixtures"; }
  else if (!TABS.includes(id)) panel = tab = id = "next";
  document.querySelectorAll(".tab").forEach(b => {
    const on = b.dataset.tab === tab;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll("[role=tabpanel]").forEach(p => p.classList.toggle("active", p.id === panel));
  $(".tab-ink").style.transform = `translateX(${TABS.indexOf(tab) * 100}%)`;
  play($("#" + panel));
  if (push) history.replaceState(null, "", "#" + id);
  window.scrollTo({ top: 0 });
}
$(".tablist").addEventListener("keydown", e => {
  const i = TABS.indexOf(document.activeElement.dataset.tab);
  if (i < 0 || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
  show(n, true); $(`[data-tab="${n}"]`).focus();
});
window.addEventListener("hashchange", () => DATA && show(location.hash.slice(1)));

/* ---------- password lock ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptData(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw.trim().toUpperCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const box of VAULT.boxes) {
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch (e) {}
  }
  throw new Error("wrong password");
}
function startSite() {
  document.body.classList.remove("locked");
  document.body.dataset.role = DATA.role || "";
  buildNav();
  renderNext(); renderFixtures(); renderTable(); renderStatsShell();
  if (DATA.fines) renderFines();
  if (DATA.role === "manager") renderManager();
  show(location.hash.slice(1));
}
const PW_KEY = "ludhamfc-pw";
$("#switchPw").addEventListener("click", () => {
  try { localStorage.removeItem(PW_KEY); } catch (e) {}
  location.hash = ""; location.reload();
});
$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = $("#lockForm"), btn = $("#unlockBtn"), pw = $("#pw").value;
  btn.disabled = true; btn.textContent = "CHECKING…"; $("#pwErr").textContent = "";
  let data = null;
  try { data = await decryptData(pw); } catch (err) {}
  if (!data) {
    $("#pwErr").textContent = "That password isn't right. Try again."; $("#pw").select();
    form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
  } else {
    form.classList.add("leaving");
    await new Promise(r => setTimeout(r, calm ? 0 : 280));
    DATA = data;
    try { $("#remember").checked ? localStorage.setItem(PW_KEY, pw) : localStorage.removeItem(PW_KEY); } catch (err) {}
    startSite();
  }
  btn.disabled = false; btn.textContent = "UNLOCK";
});
/* ---------- loading screen: ring fills, then the crest flies into the masthead ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
const loaderDone = (async () => {
  const ld = $("#loader");
  const finish = () => { document.body.classList.remove("loading"); ld.remove(); };
  if (calm) { await (document.fonts ? Promise.race([document.fonts.ready, wait(1500)]) : null); finish(); return; }
  let ready = false;
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), wait(2500)]).then(() => ready = true);
  const C = 2 * Math.PI * 80, prog = $("#ldProg"), pct = $("#ldPct"), crest = $("#ldCrest");
  prog.style.strokeDasharray = C; prog.style.strokeDashoffset = C;
  const D = 1300, t0 = performance.now();
  await new Promise(done => {
    (function step(now) {
      let p = Math.min(1, (now - t0) / D); p = 1 - Math.pow(1 - p, 3);
      if (!ready) p = Math.min(p, 0.9);
      prog.style.strokeDashoffset = C * (1 - p);
      pct.textContent = Math.round(p * 100) + "%";
      p < 1 ? requestAnimationFrame(step) : done();
    })(t0);
  });
  crest.classList.add("pop");
  await wait(320);
  window.scrollTo(0, 0);
  const from = crest.getBoundingClientRect(), to = $(".mast-row img").getBoundingClientRect();
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  ld.classList.add("flying");
  try {
    await crest.animate(
      [{ transform: "none" }, { transform: `translate(${dx}px, ${dy}px) scale(${to.width / from.width}) rotate(-360deg)` }],
      { duration: 800, easing: "cubic-bezier(.65,0,.25,1)", fill: "forwards" }).finished;
  } catch (e) {}
  finish();
})();

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(PW_KEY); } catch (e) {}
  if (saved) {
    try { const d = await decryptData(saved); await loaderDone; DATA = d; startSite(); return; } catch (e) {}
    try { localStorage.removeItem(PW_KEY); } catch (e) {}
  }
  await loaderDone;
  $("#pw").focus({ preventScroll: true });
})();
</script>

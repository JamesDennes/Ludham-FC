<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Ludham FC Matchday</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><style id="css">
/* Layout: one phone-first column; club band on top, sticky tab bar, one panel per tab, like a matchday programme in your pocket */
:root{
  --navy:#13264a; --navy-2:#1d3766; --gold:#e3a72f;
  --bg:#f3f5f9; --card:#ffffff; --fg:#14203a; --muted:#5b6782; --line:#dce2ec; --chip:#eaeef5; --link:#8a5c06;
  --good:#1f8a52; --good-bg:#e3f4ea; --warn:#b26b00; --warn-bg:#fbefd9; --bad:#c23b32; --bad-bg:#fbe5e3;
  --pitch:#2f7a45; --pitch-line:rgba(255,255,255,.55);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1426; --card:#141f37; --fg:#e8edf6; --muted:#9aa7c2; --line:#24314e; --chip:#1c2945; --link:#f0c060;
  --good:#5fd394; --good-bg:#15382a; --warn:#f2b552; --warn-bg:#3a2b10; --bad:#f2837a; --bad-bg:#3d1c1a; --pitch:#24603a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1426; --card:#141f37; --fg:#e8edf6; --muted:#9aa7c2; --line:#24314e; --chip:#1c2945; --link:#f0c060;
  --good:#5fd394; --good-bg:#15382a; --warn:#f2b552; --warn-bg:#3a2b10; --bad:#f2837a; --bad-bg:#3d1c1a; --pitch:#24603a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
a{color:var(--link)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--navy);color:#fff}
header .wrap{padding-block:18px 14px;display:flex;align-items:center;gap:14px}
.crest{width:52px;height:60px;flex:none}
.club{min-width:0;flex:1}
.club h1{font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,7vw,2.1rem);line-height:1;margin:0;letter-spacing:.02em;text-transform:uppercase}
.club p{margin:2px 0 0;color:#c4d0e8;font-size:.9rem}
.mode{flex:none;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#dbe3f3}
.mode.ed{background:var(--gold);color:#2a1c00}
.demo{background:var(--gold);color:#2a1c00;font-size:.85rem;font-weight:600}
.demo .wrap{padding-block:7px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy-2);box-shadow:0 2px 6px rgba(0,0,0,.18)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;color:#c9d4ea;text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 12px;border-radius:999px}
nav a[aria-current="page"]{background:var(--gold);color:#2a1c00}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main .wrap{padding-block:18px 110px;display:grid;gap:16px}
section{display:grid;gap:16px;min-width:0}
h2{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.edit{border:2px dashed var(--gold)}
.card.edit>.label:first-child{color:var(--link)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
p{margin:0}
.fixture{background:var(--navy);color:#fff;border:0}
.fixture .label{color:#aebbd8}
.fixture a{color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 14px;text-align:center}
.vs .team{font-family:var(--display);font-weight:900;font-size:clamp(1.15rem,6.5vw,1.9rem);line-height:1;text-transform:uppercase;overflow-wrap:break-word;min-width:0}
.vs .ko{font-family:var(--display);font-weight:800;background:var(--gold);color:#2a1c00;border-radius:10px;padding:6px 10px;font-size:1.3rem;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.facts div{background:rgba(255,255,255,.08);border-radius:10px;padding:10px;min-width:0}
.facts b{display:block;font-size:1.02rem}
.facts b.tbc{color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#2a1c00}
.btn.wa{background:#1f8a52;border-color:#1f8a52;color:#fff}
.btn.small{min-height:36px;padding:6px 10px;font-size:.88rem}
.btn.icon{min-height:34px;min-width:34px;padding:0;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:999px}
.p-gold{background:var(--gold);color:#2a1c00}
.p-good{background:var(--good-bg);color:var(--good)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.pitch{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--pitch);border-radius:12px;overflow:hidden}
.pitch::before{content:"";position:absolute;inset:4%;border:2px solid var(--pitch-line);border-radius:4px}
.pitch .half{position:absolute;left:4%;right:4%;top:50%;border-top:2px solid var(--pitch-line)}
.pitch .circle{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid var(--pitch-line);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box{position:absolute;left:28%;right:28%;bottom:4%;height:13%;border:2px solid var(--pitch-line);border-bottom:0}
.player{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;width:84px;text-align:center}
.shirt{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;border:2px solid var(--gold);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.player span{background:rgba(0,0,0,.6);color:#fff;font-size:.74rem;font-weight:600;padding:1px 6px;border-radius:6px;white-space:nowrap}
.player.empty .shirt{background:transparent;border-style:dashed}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.88rem;font-weight:500}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.counts div{border-radius:10px;padding:8px;min-width:0}
.counts b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1}
.c-in{background:var(--good-bg);color:var(--good)}
.c-maybe{background:var(--warn-bg);color:var(--warn)}
.c-out{background:var(--bad-bg);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:.86rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 10px;min-height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="in"],.seg button[aria-pressed="true"][data-v="home"]{background:var(--good-bg);color:var(--good)}
.seg button[aria-pressed="true"][data-v="maybe"],.seg button[aria-pressed="true"][data-v="away"]{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="out"]{background:var(--bad-bg);color:var(--bad)}
.list{display:grid}
.list>div{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.who{min-width:0}
.who small{display:block;color:var(--muted);font-size:.82rem}
.switch{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.switch button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;background:transparent;color:var(--muted);cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
textarea,input[type=text],input[type=tel],input[type=password],select{width:100%;font:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--fg);min-height:42px}
textarea{min-height:170px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
.slots{display:grid;grid-template-columns:52px 1fr;gap:8px 10px;align-items:center}
.slots .pos{font-weight:700;font-size:.85rem;color:var(--muted)}
.rosterrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right}
tr.top td{font-weight:700}
.step{display:inline-flex;align-items:center;gap:4px}
.step b{min-width:1.6em;text-align:center}
.seats{display:flex;gap:4px}
.seat{width:16px;height:16px;border-radius:4px;border:2px solid var(--muted)}
.seat.taken{background:var(--muted)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--navy);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 10px rgba(0,0,0,.25)}
.savebar .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar .btn{border-color:rgba(255,255,255,.3);background:transparent;color:#fff}
.savebar .btn.primary{background:var(--gold);border-color:var(--gold);color:#2a1c00}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,nav a{transition:background .15s,color .15s}}

FzSws4tz1Lt8lA+MVrmPRg==","n":310000}</script><script type="text/plain" id="src">
const SRC=document.currentScript.textContent;
const SAVED=JSON.parse(document.getElementById('state').textContent);
let S=JSON.parse(JSON.stringify(SAVED));
let canEdit=false,dirty=false,saving=false,readOnlyHit=false;
const PUBLIC=!!window.LFC_PUBLIC;let downloadsNS=null;
const POS=["GK","RB","CB","CB","LB","RM","CM","CM","LM","ST","ST"];
const XY=[[50,90],[84,72],[62,75],[38,75],[16,72],[85,48],[62,50],[38,50],[15,48],[62,22],[38,22]];
const TABS=[["match","Matchday"],["stats","Goals & assists"],["available","Availability"],["messages","Manager"],["lifts","Lifts"],["subs","Subs"]];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const first=n=>String(n).split(' ')[0];
const last=n=>{const p=String(n).split(' ');return p[p.length-1]};
const tab=()=>{const h=location.hash.slice(1);if(window.LFC_PUBLIC&&(h==='available'||h==='messages'))return 'match';return TABS.some(t=>t[0]===h)?h:'match'};

function postText(){
  const f=S.fixture,ha=f.ha==='home'?'HOME':'AWAY',vs=f.ha==='home'?'v':'at';
  if(f.stage!=='conf')return "⚽ NEXT FIXTURE\n"+f.date+" · "+ha+" "+vs+" "+f.opp+"\nKick-off "+f.ko+"\nVenue: to be confirmed\n\nVenue and squad to follow once confirmed. Get your availability in by Wednesday.";
  const xi=S.lineup.map((n,i)=>n?POS[i]+"  "+n:"").filter(Boolean).join("\n");
  const subs=S.subs.filter(Boolean).join(", ");
  return "✅ CONFIRMED · "+f.date+" · "+ha+" "+vs+" "+f.opp+"\nVenue: "+(f.venue||"to be confirmed")+"\nMeet: "+(f.meet||"to be confirmed")+" · KO "+f.ko+"\n\nSQUAD\n"+xi+(subs?"\n\nSubs: "+subs:"");
}
function opts(sel){return '<option value="">—</option>'+S.roster.map(p=>'<option'+(p.n===sel?' selected':'')+'>'+esc(p.n)+'</option>').join('')}

function vMatch(){
  const f=S.fixture,conf=f.stage==='conf',tbc='To be confirmed';
  let h='';
  if(canEdit)h+=`<div class="card edit"><div class="label">Edit fixture</div>
   <div class="row" style="margin:10px 0">
    <div class="switch" role="group" aria-label="Stage"><button data-act="stage" data-v="mon" aria-pressed="${!conf}">1 · Monday notice</button><button data-act="stage" data-v="conf" aria-pressed="${conf}">2 · Confirmed</button></div>
    <div class="seg" role="group" aria-label="Home or away"><button data-act="ha" data-v="home" aria-pressed="${f.ha==='home'}">Home</button><button data-act="ha" data-v="away" aria-pressed="${f.ha==='away'}">Away</button></div>
   </div>
   <div class="form">
    <label>Opponent<input type="text" id="f-opp" data-f="opp" value="${esc(f.opp)}"></label>
    <label>Date<input type="text" id="f-date" data-f="date" value="${esc(f.date)}"></label>
    <label>Kick-off<input type="text" id="f-ko" data-f="ko" value="${esc(f.ko)}"></label>
    <label>Venue (blank = to be confirmed)<input type="text" id="f-venue" data-f="venue" value="${esc(f.venue)}"></label>
    <label>Meet<input type="text" id="f-meet" data-f="meet" value="${esc(f.meet)}"></label>
    <label>Maps search or postcode<input type="text" id="f-map" data-f="map" value="${esc(f.map)}"></label>
   </div></div>`;
  h+=`<div class="card fixture"><div class="row between"><div class="label">Next fixture · NEN League Division 1</div><span class="pill p-gold">${f.ha==='home'?'HOME':'AWAY'}</span></div>
   <div class="vs"><div class="team">${esc(f.ha==='home'?'Ludham':f.opp)}</div><div class="ko num">${esc(f.ko)}</div><div class="team">${esc(f.ha==='home'?f.opp:'Ludham')}</div></div>
   <div class="facts">
    <div><span class="label">Date</span><b>${esc(f.date)}</b></div>
    <div><span class="label">Venue</span><b class="${conf&&f.venue?'':'tbc'}">${esc(conf&&f.venue?f.venue:tbc)}</b></div>
    <div><span class="label">Meet</span><b class="${conf&&f.meet?'':'tbc'}">${esc(conf&&f.meet?f.meet:tbc)}</b></div>
    <div><span class="label">Squad</span><b class="${conf?'':'tbc'}">${conf?'Confirmed, see below':'Named once venue is confirmed'}</b></div>
   </div>
   ${conf&&(f.map||f.venue)?`<p style="margin-top:12px;font-size:.9rem"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.map||f.venue)}" target="_blank" rel="noopener">Open venue in Maps</a></p>`:''}</div>`;
  if(conf||canEdit){
    h+=`<div><h2>Squad v ${esc(f.opp)}</h2>${!conf?'<p class="muted" style="margin-top:4px">Only you can see this until the stage is set to Confirmed and saved.</p>':''}</div>
    <div class="pitch" role="img" aria-label="Team in a 4-4-2"><div class="half"></div><div class="circle"></div><div class="box"></div>
    ${S.lineup.map((n,i)=>`<div class="player${n?'':' empty'}" style="left:${XY[i][0]}%;top:${XY[i][1]}%"><div class="shirt">${POS[i]}</div><span>${esc(n?last(n):'Empty')}</span></div>`).join('')}</div>
    <div class="card"><div class="label">Subs</div><div class="bench" style="margin-top:8px">${S.subs.filter(Boolean).map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<span class="muted">None picked</span>'}</div></div>`;
  }
  if(canEdit){
    h+=`<div class="card edit"><div class="label">Edit squad</div><p class="muted" style="margin:6px 0 10px;font-size:.88rem">Pick from the squad list on the Manager tab.</p>
    <div class="slots">${S.lineup.map((n,i)=>`<span class="pos">${POS[i]}</span><select id="xi-${i}" data-xi="${i}" aria-label="${POS[i]}">${opts(n)}</select>`).join('')}

let artifactNS=null;
async function save(){
  if(saving)return;
  if(dupes().length){toast('Someone is picked twice. Fix the squad first.');return}
  if(!artifactNS){toast('Saving is not available in this view.');return}
  saving=true;rerender();
  try{await artifactNS.publish(buildDoc(S));dirty=false;toast('Saved. Players now see this version.')}
  catch(err){
    saving=false;const c=err&&err.code;
    if(c==='conflict'){dirty=false;toast('Someone else saved first. Loading their version.')}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'){canEdit=false;dirty=false;S=JSON.parse(JSON.stringify(SAVED));toast('This view is read-only.')}
    else if(c==='rate_limited')toast('Saving too often. Wait a moment, then save again.');
    else toast('Could not save. Try again in a moment.');
    rerender();
  }
}

const normPw=v=>String(v||'').trim().toUpperCase();
function publicState(src){const ps=JSON.parse(JSON.stringify(src));delete ps.pw;ps.roster=ps.roster.map(p=>({n:p.n,ph:''}));return ps}
async function encryptFor(pw,text){
  const te=new TextEncoder(),n=310000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k0=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(text)));
  const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
  return {s:b64(salt),i:b64(iv),c:b64(ct),n};
}
async function makePublic(src){
  const pw=normPw(src.pw);if(!pw)throw {code:'no_pw'};
  const ps=publicState(src);ps.updated=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  return buildDoc(null,true,await encryptFor(pw,JSON.stringify(ps)));
}
function lockLoader(){
  var E=window.LFC_ENC,app=document.getElementById('app');
  var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  async function dec(pw){
    var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.s),iterations:E.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.i)},k,b(E.c)));
  }
  function boot(json){
    var st=document.createElement('script');st.type='application/json';st.id='state';st.textContent=json;document.body.appendChild(st);
    var sc=document.createElement('script');sc.textContent=document.getElementById('src').textContent;document.body.appendChild(sc);
  }
  async function attempt(pw){try{var j=await dec(pw);try{localStorage.setItem('lfc-pw',pw)}catch(e){}boot(j);return true}catch(e){return false}}
  function show(msg){
    app.innerHTML='<header class="band"><div class="wrap"><div class="club"><h1>Ludham FC</h1><p>Matchday page</p></div></div></header>'
     +'<main><div class="wrap"><form class="card" id="lock" style="display:grid;gap:10px;max-width:420px">'
     +'<h2>Members only</h2><p class="muted">Enter the club password from the team WhatsApp chat.</p>'
     +'<label class="label" for="lpw">Club password</label><input type="password" id="lpw" autocapitalize="characters" autocomplete="current-password" required>'
     +'<button class="btn primary" type="submit" id="lgo">Open</button><p class="note" id="lerr"'+(msg?'':' hidden')+'>'+(msg||'')+'</p></form></div></main>';
    var f=document.getElementById('lock');
    f.addEventListener('submit',async function(e){
      e.preventDefault();var btn=document.getElementById('lgo'),err=document.getElementById('lerr');
      btn.disabled=true;btn.textContent='Opening…';
      var ok=await attempt(document.getElementById('lpw').value.trim().toUpperCase());
      if(!ok){btn.disabled=false;btn.textContent='Open';err.hidden=false;err.textContent='That password didn\'t work. Check the team WhatsApp chat for the current one.';}
    });

<script>(function lockLoader(){
  var E=window.LFC_ENC,app=document.getElementById('app');
  var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  async function dec(pw){
    var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.s),iterations:E.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.i)},k,b(E.c)));
  }
  function boot(json){
    var st=document.createElement('script');st.type='application/json';st.id='state';st.textContent=json;document.body.appendChild(st);
    var sc=document.createElement('script');sc.textContent=document.getElementById('src').textContent;document.body.appendChild(sc);
  }
  async function attempt(pw){try{var j=await dec(pw);try{localStorage.setItem('lfc-pw',pw)}catch(e){}boot(j);return true}catch(e){return false}}
  function show(msg){
    app.innerHTML='<header class="band"><div class="wrap"><div class="club"><h1>Ludham FC</h1><p>Matchday page</p></div></div></header>'
     +'<main><div class="wrap"><form class="card" id="lock" style="display:grid;gap:10px;max-width:420px">'

     +'<label class="label" for="lpw">Club password</label><input type="password" id="lpw" autocapitalize="characters" autocomplete="current-password" required>'
     +'<button class="btn primary" type="submit" id="lgo">Open</button><p class="note" id="lerr"'+(msg?'':' hidden')+'>'+(msg||'')+'</p></form></div></main>';
    var f=document.getElementById('lock');
    f.addEventListener('submit',async function(e){
      e.preventDefault();var btn=document.getElementById('lgo'),err=document.getElementById('lerr');
      btn.disabled=true;btn.textContent='Opening…';
      var ok=await attempt(document.getElementById('lpw').value.trim().toUpperCase());
      if(!ok){btn.disabled=false;btn.textContent='Open';err.hidden=false;err.textContent='That password didn\'t work. Check the team WhatsApp chat for the current one.';}
    });
  }
  if(!window.crypto||!crypto.subtle){show('This page needs a secure (https) link to open.');return}
  var saved=null;try{saved=localStorage.getItem('lfc-pw')}catch(e){}
  show('');
  if(saved)attempt(saved);
})()</script>

name: Full-Time probe
on:
  push:
    branches: [fulltime-probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Full-Time pages
        run: |
          set -x
          mkdir -p raw
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          B="https://fulltime.thefa.com"
          curl -sSL -A "$UA" -o raw/index.html -w "index %{http_code} %{size_download}\n" "$B/index.html?league=7079615" >> raw/status.txt || true
          grep -oE '(table|fixtures|results|displayTeam|leagueTable)[A-Za-z]*\.html\?[^"'"'"' ]*' raw/index.html | sed 's/&amp;/\&/g' | sort -u > raw/links.txt || true
          i=0
          grep -E '^table\.html' raw/links.txt | head -8 | while read -r l; do
            i=$((i+1)); curl -sSL -A "$UA" -o "raw/table$i.html" -w "table$i %{http_code} %{size_download} $l\n" "$B/$l" >> raw/status.txt || true
          done
          for f in raw/table*.html; do grep -il ludham "$f" >> raw/has-ludham.txt || true; done
          grep -ohE 'displayTeam\.html\?[^"'"'"' ]*' raw/table*.html 2>/dev/null | sed 's/&amp;/\&/g' | sort -u > raw/team-links.txt || true
          grep -iE 'ludham' -B2 -A2 raw/table*.html | grep -oE 'displayTeam\.html\?[^"'"'"' ]*' | sed 's/&amp;/\&/g' | sort -u > raw/ludham-links.txt || true
          head -1 raw/ludham-links.txt | while read -r l; do curl -sSL -A "$UA" -o raw/ludham.html -w "ludham %{http_code} %{size_download} $l\n" "$B/$l" >> raw/status.txt || true; done
          cat raw/status.txt
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          git commit -m "Full-Time probe results" || exit 0
          git push
